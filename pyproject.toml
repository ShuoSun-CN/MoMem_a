[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momem"
version = "0.1.0"
description = "MoMem memory framework for explicit text records and reusable handling experience."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["MoMem*"]
